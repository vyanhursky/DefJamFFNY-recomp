name: Windows candidate installer

# Build a test installer from this branch's exact source, without a release tag
# or a built game. The issue-specific push trigger can be removed after testing;
# workflow_dispatch keeps this useful for later explicitly requested candidates.
on:
  push:
    branches: [fix/issue72-startup]
    paths:
      - tools/xboxrecomp
      - .github/workflows/windows-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-candidate:
    name: Windows memory fixtures and game-free installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install packaging and test dependencies
        run: python -m pip install pytest pyxbe capstone Pillow==12.3.0 numpy==2.5.2
      - name: Verify source publication policy
        run: python scripts/check-source-tree.py
      - name: Native Windows address placement and memory regressions
        shell: pwsh
        run: |
          foreach ($fixture in @('windows_guest_layout', 'memory_regressions')) {
            cmake -S "tools/xboxrecomp/tests/$fixture" -B "build/fx-$fixture" -G Ninja -DCMAKE_BUILD_TYPE=Release
            if ($LASTEXITCODE) { throw "Configure failed: $fixture" }
            cmake --build "build/fx-$fixture"
            if ($LASTEXITCODE) { throw "Build failed: $fixture" }
            ctest --test-dir "build/fx-$fixture" --output-on-failure --no-tests=error
            if ($LASTEXITCODE) { throw "Fixture failed: $fixture" }
          }
      - name: Compile game-side sources without translated game code
        run: python scripts/compile-game-sources.py
      - name: Installer recovery and packaging boundaries
        run: >-
          python -m pytest -q --junitxml=build/candidate-setup-tests.xml
          tests/unit/test_setup_updates.py tests/unit/test_setup_engine.py
          tests/unit/test_setup_status.py tests/unit/test_hd_setup.py
          tests/unit/test_source_release.py
      - name: Build and inventory production-format game-free setup
        shell: pwsh
        run: ./scripts/build-setup.ps1
      - name: Smoke-test packaged setup without a dump
        shell: pwsh
        run: |
          $setupPath = (Resolve-Path build/setup/DefJamSetup.exe).Path
          foreach ($mode in @('--ui-smoke', '--ui-preparation-smoke')) {
            $process = Start-Process -FilePath $setupPath -ArgumentList $mode -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Setup smoke failed: $mode" }
          }
          $app = Join-Path $env:RUNNER_TEMP 'defjam-issue72-app'
          $data = Join-Path $env:RUNNER_TEMP 'defjam-issue72-data'
          $process = Start-Process -FilePath $setupPath -ArgumentList "--silent --dump missing.iso --install-dir `"$app`" --data-dir `"$data`"" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 2) { throw "Expected invalid-input exit 2, got $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: issue72-windows-setup-${{ github.sha }}
          path: build/setup-assets/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue72-windows-test-reports-${{ github.sha }}
          path: |
            build/candidate-setup-tests.xml
            build/fx-*/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30
